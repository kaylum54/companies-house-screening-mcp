name: Release

# Publishing is driven by a tag, not by a merge to main. A release should be a
# deliberate act with a name, and a tag is the only artefact that survives to
# tell you which commit a published version came from.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: The tag must match the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi
          echo "Releasing $PKG"

      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run build
      - run: npm run test:coverage
      # The Node suite is not evidence the deployed Worker runs — see the
      # `workers` job in ci.yml. A release should not go out without it.
      - run: npm run test:workers
      - run: npm run release:check

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the workflow needs an OIDC token so npm
      # can attest that this tarball was built here, from this commit, by this
      # workflow. Without it `--provenance` fails rather than silently
      # publishing something unattested.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. An older npm does not
      # fail loudly — it falls back to looking for a token that is no longer
      # there, and reports an auth error that says nothing about the real
      # cause. Pinning the floor here makes that impossible.
      - run: npm install -g npm@latest

      - run: npm ci

      # Published via npm Trusted Publishing: the `id-token: write` permission
      # above lets npm verify this workflow's OIDC identity directly against
      # the trusted publisher configured on the package. There is no
      # NODE_AUTH_TOKEN and no NPM_TOKEN secret — nothing to leak and nothing
      # to rotate.
      #
      # It replaced a granular token, which npm rejected anyway: publishing
      # from CI needs a token flagged to bypass 2FA, and npm is removing those
      # for direct publishing in January 2027.
      #
      # `--provenance` is implied under trusted publishing but stated so the
      # intent survives someone reading only this line.
      #
      # `prepublishOnly` runs the checks again here, minus the tarball
      # inspection: nested inside a publish, `npm pack --dry-run` returns
      # nothing and the check fails a release that is fine. The verify job
      # above runs it in full and this job depends on that, so nothing is
      # lost.
      - name: Publish to npm
        run: npm publish --provenance --access public

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same argument as npm provenance: an image nobody can trace back to a
      # commit is an image nobody should run.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
