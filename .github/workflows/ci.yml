name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:15 UTC daily. The live smoke job runs on this trigger only.
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json engines; 24 is current.
        # Testing only one of them makes the floor a claim rather than a fact.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The reference in docs/tools and the worked examples in docs/recipes are
      # generated from the running server. This fails the build when a schema
      # or a description changed and the pages did not, which is the mechanism
      # that keeps the documentation from going stale.
      - name: Documentation is up to date
        run: npm run docs:check

      # Build first: tests/bin.test.ts exercises the compiled entry point as a
      # real process and skips itself when dist is absent. Testing before
      # building would silently skip it in the one place it matters most.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

  workers:
    # The Node suite proves the logic; this proves the runtime. A detached
    # `globalThis.fetch` passes every Node test and throws `Illegal
    # invocation` on workerd, so a green Node suite is not evidence that the
    # deployed Worker runs. Separate job because the two cannot share a pool.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Runs the Worker inside workerd against the bindings wrangler.toml
      # declares, with only Companies House replaced. No network access.
      - name: Test on workerd
        run: npm run test:workers

  live-smoke:
    # Fixtures make the suite fast and offline. This is the price of that: it
    # runs against the real API on a schedule so that a change to the API
    # surfaces here rather than in somebody's terminal.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Live API smoke test
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          CH_CACHE_ENABLED: 'false'
        run: |
          if [ -z "$COMPANIES_HOUSE_API_KEY" ]; then
            echo "::warning::COMPANIES_HOUSE_API_KEY is not set; skipping the live smoke test."
            exit 0
          fi
          npm run test:live
